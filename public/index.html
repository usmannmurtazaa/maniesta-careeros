    <!-- Inter stylesheet.
         Uses the variable-font form (`wght@300..900`) rather than the
         discrete list (`wght@300;400;500;...;900`). Google serves a single
         file for the variable form, covering every weight between 300 and
         900 - typically 40-60% smaller than the seven-file discrete form.
         The previous duplicate <link rel="preload" as="style"> was removed;
         the stylesheet below is discovered immediately and the preload
         added no benefit. The `crossorigin` attribute was removed because
         it forces a CORS-mode fetch of the CSS, which Google Fonts allows
         but which is unnecessary for a same-context stylesheet and can
         produce a spurious console warning if the response headers ever
         change. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap"
      rel="stylesheet"
    />

         * currently in progress - Sidebar.jsx, DashboardLayout.jsx,

         */
        overflow-x: hidden;

        }
      }
      
      /* Focus visible styles — brand indigo, matches --color-primary

      }
      
      ::-moz-selection {
        background-color: #6366f1;
        color: white;
      }
      
      /* Scrollbar styles. The track is transparent to match the
         equivalent rule in globals.css and to avoid a visible seam on
         short scroll containers. */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent;
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 4px;
        min-height: 40px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1a1;
      }
      
      @media (prefers-color-scheme: dark) {
        ::-webkit-scrollbar-thumb {
          background: #4b5563;
        }
        
        ::-webkit-scrollbar-thumb:hover {
          background: #6b7280;
        }
      }
      
      /* Initial loader with exit animation */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f9fafb;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
        will-change: opacity;
      }
      
      .initial-loader.dark {
        background: #111827;
      }
      
      .initial-loader.exit {
        opacity: 0;
        pointer-events: none;
      }
      
      .initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .initial-loader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @media (prefers-color-scheme: dark) {
        .initial-loader .spinner {
          border-color: #374151;
          border-top-color: #818cf8;
        }
      }
      
      .initial-loader .loading-text {
        font-family: 'Inter', 'Inter Fallback', sans-serif;
        font-size: 14px;
        color: #6b7280;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      @media (prefers-color-scheme: dark) {
        .initial-loader .loading-text {
          color: #9ca3af;
        }
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .initial-loader .spinner {
          animation: none;
          border-top-color: transparent;
          border-color: #e5e7eb;
        }
        
        .initial-loader .loading-text {
          animation: none;
        }
        
        .initial-loader.exit {
          opacity: 0;
        }
      }

    <!-- Loader removal logic -->
    <script>
      (function() {
        'use strict';
        
        // Dark mode initialization
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var savedTheme = localStorage.getItem('theme');
        var isDark = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark);
        
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.getElementById('initial-loader').classList.add('dark');
        }
        
        // Set color scheme meta
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        
        // Unified loader removal
        window.removeInitialLoader = function() {
          var loader = document.getElementById('initial-loader');
          if (!loader) return;
          
          loader.classList.add('exit');
          
          var transitionDuration = 300;
          
          var cleanup = function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
            document.documentElement.classList.remove('preload');
          };
          
          setTimeout(cleanup, transitionDuration);
          setTimeout(cleanup, transitionDuration + 500);
        };
        
        // Fallback timeout
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader && !loader.classList.contains('exit')) {
            console.warn('Application load timeout - forcing loader removal');
            window.removeInitialLoader();
          }
        }, 8000);
      })();
    </script>
